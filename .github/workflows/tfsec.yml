# documentation.

name: tfsec

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]  
  schedule:
    - cron: '41 17 * * 0'

jobs:
  tfsec:
    name: Run tfsec sarif report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Clone repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        
      - name: Set global git configs
        run: |
          git config --local --remove-section http."https://github.com/"
          git config --global url."https://git:${GH_TOKEN}@github.com/PaloAltoNetworks".insteadOf "https://github.com/PaloAltoNetworks"
          git config --global user.name simonpanw          
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@ed3a0531877aca392eb870f440d9ae7aba83a6bd # v1
        with:
          # terraform_version: 0.13.0:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          
      - name: Terraform Init
        id: init
        run: terraform init

      - name: Run tfsec
        uses: aquasecurity/tfsec-sarif-action@9a83b5c3524f825c020e356335855741fd02745f
        with:
          sarif_file: tfsec.sarif         

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: tfsec.sarif  
